<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Все ссылки</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><g stroke='%23D6FF3F' stroke-width='5' stroke-linecap='round'><line x1='20' y1='5' x2='20' y2='35'/><line x1='7.7' y1='12.5' x2='32.3' y2='27.5'/><line x1='7.7' y1='27.5' x2='32.3' y2='12.5'/></g></svg>">
<script>document.documentElement.className='js'</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2/dist/iconify-icon.min.js"></script>
<style>
  :root{
    --bg:#0F0E0B;            /* тёплый уголь */
    --ink:#F4EFE2;           /* кремовый текст */
    --soft:#CFC9B8;
    --muted:#9A9486;
    --acid:#D6FF3F;          /* кислотный лайм — главный сигнал */
    --on-c:#131109;          /* тёмный текст поверх цветных заливок */
    --line:rgba(244,239,226,.16);
    --disp:'Unbounded',sans-serif;
    --mono:'IBM Plex Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);color:var(--ink);
    font-family:var(--disp);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:var(--acid);color:var(--on-c)}
  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--acid);border:3px solid var(--bg);border-radius:8px}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:none}
  :focus-visible{outline:2px solid var(--acid);outline-offset:3px}

  .wrap{max-width:1400px;margin:0 auto;padding-inline:clamp(16px,4vw,48px)}
  .mono{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.1em}

  /* ---------- зерно ---------- */
  .noise{
    position:fixed;inset:0;z-index:100;pointer-events:none;opacity:.07;
    background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
  }

  /* ---------- курсор ---------- */
  .cursor-dot,.cursor-ring{
    position:fixed;top:0;left:0;border-radius:50%;pointer-events:none;z-index:200;
    mix-blend-mode:difference;opacity:0;
  }
  .cursor-dot{width:8px;height:8px;background:#fff}
  .cursor-ring{width:30px;height:30px;border:1px solid #fff}
  @media (pointer:fine){
    body, a, button, [data-hover]{cursor:none}
    .cursor-dot,.cursor-ring{opacity:1}
  }
  @media (pointer:coarse){.cursor-dot,.cursor-ring{display:none}}

  /* ---------- плавающая иконка канала ---------- */
  .float-icon{
    position:fixed;top:0;left:0;z-index:40;pointer-events:none;color:var(--acid);
    opacity:0;transition:opacity .35s ease;will-change:transform;
  }
  .float-icon iconify-icon{font-size:clamp(90px,10vw,140px);display:block}
  @media (pointer:coarse){.float-icon{display:none}}

  /* ---------- шапка ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand svg{width:16px;height:16px;color:var(--acid);animation:spin 14s linear infinite}
  .brand span{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.14em}
  .topbar-right{display:flex;align-items:center;gap:clamp(14px,3vw,34px)}
  .status{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.16em}
  .dot-live{width:7px;height:7px;border-radius:50%;background:var(--acid);animation:pulse 2.2s ease-out infinite}
  .clock{font-family:var(--mono);font-size:12px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(214,255,63,.45)}
    70%{box-shadow:0 0 0 9px rgba(214,255,63,0)}
    100%{box-shadow:0 0 0 0 rgba(214,255,63,0)}
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (max-width:560px){.status span{display:none}}

  /* ---------- герой ---------- */
  .hero{padding-top:clamp(48px,9vh,110px);padding-bottom:clamp(40px,7vh,80px)}
  .hero-head{color:var(--muted)}
  .hero-name{
    font-size:clamp(2.5rem,10.5vw,9.5rem);
    font-weight:600;line-height:.98;letter-spacing:-.02em;
    margin:clamp(14px,2.5vh,26px) 0 clamp(20px,3.5vh,34px);
    text-transform:uppercase;
  }
  .hero-name .w{display:inline-block;white-space:nowrap}
  .hero-name .l{display:inline-block;margin-right:-.015em;will-change:font-variation-settings}
  .js .hero-name .l{opacity:0;transform:translateY(.55em) rotate(2deg)}
  .js .hero-name.ready .l{
    opacity:1;transform:none;
    transition:opacity .7s ease var(--ld,0s),transform .9s cubic-bezier(.22,1,.36,1) var(--ld,0s);
  }
  .hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
  .hero-sub{
    font-family:var(--mono);font-size:clamp(13px,1.4vw,15px);
    line-height:1.75;letter-spacing:.01em;max-width:52ch;color:var(--soft);
  }
  .hero-star{
    width:clamp(64px,11vw,140px);height:auto;flex-shrink:0;color:var(--acid);
    animation:spin 28s linear infinite;
  }
  .hero-meta{
    display:flex;flex-wrap:wrap;gap:.6rem 2.6rem;
    border-top:1px solid var(--line);
    margin-top:clamp(28px,5vh,46px);padding-top:16px;color:var(--muted);
  }

  /* ---------- лаймовая лента ---------- */
  .ticker{overflow:hidden;background:var(--acid);padding:13px 0}
  .ticker-track{display:flex;width:max-content;animation:tick 38s linear infinite}
  .ticker:hover .ticker-track{animation-play-state:paused}
  .tg{display:flex;align-items:center;gap:2.4rem;padding-right:2.4rem}
  .tg span{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.18em;white-space:nowrap;color:var(--on-c)}
  .tg svg{width:10px;height:10px;color:var(--on-c);flex-shrink:0}
  @keyframes tick{to{transform:translateX(-50%)}}

  /* ---------- заголовки секций ---------- */
  .sec-head{
    display:flex;justify-content:space-between;align-items:baseline;
    border-top:2px solid var(--ink);padding-top:14px;
  }
  .sec-label{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.18em;color:var(--muted)}
  .sec-count{font-weight:700;font-size:15px}

  /* ---------- индекс каналов: каждый красится в свой цвет ---------- */
  .index{padding-top:clamp(44px,8vh,72px)}
  .rows{margin-top:clamp(20px,3vh,30px)}
  .row{
    position:relative;display:grid;overflow:hidden;
    grid-template-columns:2.4rem 42px minmax(0,1fr) auto 26px;
    align-items:center;gap:clamp(10px,2vw,22px);
    padding:clamp(15px,2.4vw,23px) clamp(4px,1vw,14px);
    border-top:1px solid var(--line);
    --c:var(--acid); /* цвет заливки задаётся из JS */
  }
  .row:last-child{border-bottom:1px solid var(--line)}
  .row::before{
    content:'';position:absolute;inset:0;background:var(--c);
    transform:scaleX(0);transform-origin:right;
    transition:transform .5s cubic-bezier(.76,0,.24,1);
  }
  .row:hover::before,.row:focus-visible::before{transform:scaleX(1);transform-origin:left}
  .row>*{position:relative;z-index:1;transition:color .3s ease .05s}
  .row-i{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .row:hover .row-i,.row:focus-visible .row-i{color:var(--on-c)}
  .row-icon{
    width:42px;height:42px;border:1px solid var(--line);border-radius:50%;
    display:grid;place-items:center;color:var(--ink);
    transition:border-color .3s ease .05s,color .3s ease .05s;
  }
  .row-icon iconify-icon{font-size:18px}
  .row:hover .row-icon,.row:focus-visible .row-icon{color:var(--on-c);border-color:rgba(19,17,9,.35)}
  .row-main{display:flex;align-items:baseline;gap:16px;min-width:0}
  .row-name{
    font-weight:600;text-transform:uppercase;
    font-size:clamp(1.2rem,3vw,2.1rem);line-height:1.05;letter-spacing:-.01em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .row-note{
    margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.03em;
    color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    opacity:0;transform:translateX(12px);transition:.35s ease .05s;
  }
  .row:hover .row-note,.row:focus-visible .row-note{opacity:1;transform:none;color:rgba(19,17,9,.72)}
  .row-handle{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted);justify-self:end}
  .row:hover .row-handle,.row:focus-visible .row-handle{color:var(--on-c)}
  .row-arrow{color:var(--muted);transform:translateX(-8px);opacity:.4;transition:.35s ease .05s}
  .row-arrow svg{width:20px;height:20px;display:block;stroke:currentColor;fill:none;stroke-width:1.8}
  .row:hover .row-arrow,.row:focus-visible .row-arrow{transform:none;opacity:1;color:var(--on-c)}
  @media (max-width:820px){.row-note{display:none}}
  @media (max-width:560px){
    .row{grid-template-columns:1.5rem 34px minmax(0,1fr) 20px}
    .row-handle{display:none}
    .row-icon{width:34px;height:34px}
    .row-icon iconify-icon{font-size:15px}
  }

  /* ---------- прямая связь ---------- */
  .contact{margin-top:clamp(70px,13vh,130px)}
  .email{
    display:inline-flex;align-items:center;gap:clamp(10px,2vw,20px);
    margin-top:clamp(24px,4vh,40px);
    font-weight:600;letter-spacing:-.01em;
    font-size:clamp(1.25rem,4.6vw,3.3rem);text-transform:uppercase;
    word-break:break-all;text-align:left;
  }
  .email svg{width:clamp(20px,2.4vw,26px);height:auto;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;opacity:.45;transition:.3s}
  .email:hover span{text-decoration:underline;text-decoration-color:var(--acid);text-decoration-thickness:.09em;text-underline-offset:.22em}
  .email:hover svg{opacity:1;stroke:var(--acid)}
  .contact-hint{margin-top:18px;color:var(--muted);text-transform:none;letter-spacing:.04em;font-size:12px}
  .contact-hint a{text-decoration:underline;text-underline-offset:3px}
  .contact-hint a:hover{color:var(--acid)}

  /* ---------- футер ---------- */
  footer{margin-top:clamp(70px,12vh,120px);border-top:1px solid var(--line)}
  footer .wrap{
    display:flex;flex-wrap:wrap;gap:.8rem 2rem;justify-content:space-between;align-items:center;
    padding-block:20px;color:var(--muted);font-size:10px;letter-spacing:.14em;
  }
  .to-top{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink)}
  .to-top svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .3s}
  .to-top:hover svg{transform:translateY(-3px)}
  .to-top:hover{color:var(--acid)}

  /* ---------- тост ---------- */
  .toast{
    position:fixed;left:50%;bottom:26px;z-index:300;
    display:flex;align-items:center;gap:10px;
    background:var(--acid);color:var(--on-c);
    padding:11px 20px;border-radius:999px;font-size:12px;letter-spacing:.05em;
    transform:translate(-50%,180%);transition:transform .5s cubic-bezier(.22,1,.36,1);
  }
  .toast.show{transform:translate(-50%,0)}
  .toast svg{width:14px;height:14px;stroke:var(--on-c);fill:none;stroke-width:2.2}

  /* ---------- появление ---------- */
  [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .8s ease var(--d,0s),transform .8s cubic-bezier(.22,1,.36,1) var(--d,0s)}
  [data-reveal].in{opacity:1;transform:none}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    [data-reveal],.js .hero-name .l{opacity:1;transform:none}
  }
</style>
</head>
<body>

<div class="noise"></div>
<div class="cursor-dot" id="cDot"></div>
<div class="cursor-ring" id="cRing"></div>
<div class="float-icon" id="floatIcon"><iconify-icon id="floatGlyph" icon="simple-icons:telegram"></iconify-icon></div>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="Наверх">
      <svg viewBox="0 0 40 40"><g stroke="currentColor" stroke-width="5" stroke-linecap="round"><line x1="20" y1="5" x2="20" y2="35"/><line x1="7.7" y1="12.5" x2="32.3" y2="27.5"/><line x1="7.7" y1="27.5" x2="32.3" y2="12.5"/></g></svg>
      <span id="brandName"></span>
    </a>
    <div class="topbar-right">
      <span class="status"><i class="dot-live"></i><span>ОТКРЫТ К ПРЕДЛОЖЕНИЯМ</span></span>
      <span class="clock" id="clock">--:--:--</span>
    </div>
  </div>
</header>

<main id="top">
  <!-- 01. Профиль -->
  <section class="hero wrap">
    <p class="hero-head mono" data-reveal>01 — ЛИЧНАЯ СТРАНИЦА · ВСЕ КАНАЛЫ В ОДНОМ МЕСТЕ</p>
    <h1 class="hero-name" id="heroName">АЛЕКС ВОЛКОВ</h1>
    <div class="hero-row">
      <p class="hero-sub" id="heroSub" data-reveal style="--d:.15s"></p>
      <svg class="hero-star" viewBox="0 0 40 40" data-hover aria-hidden="true"><g stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><line x1="20" y1="3" x2="20" y2="37"/><line x1="5.3" y1="11.5" x2="34.7" y2="28.5"/><line x1="5.3" y1="28.5" x2="34.7" y2="11.5"/></g></svg>
    </div>
    <div class="hero-meta mono" id="heroMeta" data-reveal style="--d:.25s"></div>
  </section>

  <!-- Лента -->
  <div class="ticker" data-reveal style="--d:.1s">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <!-- 02. Каналы -->
  <section class="index wrap">
    <div class="sec-head" data-reveal>
      <span class="sec-label">02 — КАНАЛЫ СВЯЗИ</span>
      <span class="sec-count" id="secCount">00</span>
    </div>
    <div class="rows" id="rows"></div>
  </section>

  <!-- 03. Прямая связь -->
  <section class="contact wrap">
    <div class="sec-head" data-reveal>
      <span class="sec-label">03 — ПРЯМАЯ СВЯЗЬ</span>
    </div>
    <button class="email" id="emailBtn" data-reveal style="--d:.1s" aria-label="Скопировать адрес почты">
      <span id="emailText"></span>
      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
    </button>
    <p class="contact-hint mono" data-reveal style="--d:.18s">клик по адресу — скопировать &nbsp;·&nbsp; <a id="mailtoLink" data-hover>открыть почтовый клиент</a></p>
  </section>
</main>

<footer>
  <div class="wrap">
    <span class="mono" id="footName"></span>
    <span class="mono">СВЕРСТАНО ВРУЧНУЮ — БЕЗ ШАБЛОНОВ</span>
    <button class="to-top" id="toTop" data-hover>
      НАВЕРХ
      <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</footer>

<div class="toast mono" id="toast" role="status">
  <svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>
  <span></span>
</div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);

/* ============================================================
   РЕДАКТИРУЙТЕ ЭТОТ БЛОК — здесь все ваши данные
   ============================================================ */
const PROFILE = {
  name: 'Алекс Волков',
  role: 'Дизайнер и разработчик интерфейсов. Собрал здесь все свои соцсети и каналы — выбирайте, где удобнее общаться.',
  location: 'Москва · UTC+3',
  email: 'hello@aleksvolkov.ru',
  topics: ['ОТКРЫТ К ПРОЕКТАМ','ДИЗАЙН ИНТЕРФЕЙСОВ','ФРОНТЕНД','ТИПОГРАФИКА','КОЛЛАБОРАЦИИ','МУЗЫКА'],
};

// Список соцсетей. color — цвет подсветки строки при наведении;
// поле можно удалить — тогда будет кислотный лайм по умолчанию.
// Иконки: https://icon-sets.iconify.design/simple-icons/
const LINKS = [
  { icon:'simple-icons:telegram',  name:'Telegram',  handle:'@aleks_volkov', note:'быстрые вопросы и посты', url:'https://t.me/aleks_volkov',        color:'#3FB6FF' },
  { icon:'simple-icons:instagram', name:'Instagram', handle:'@aleks.volkov', note:'закулисье и визуалы',     url:'https://instagram.com/aleks.volkov',color:'#FF5E7E' },
  { icon:'simple-icons:youtube',   name:'YouTube',   handle:'@aleksvolkov',  note:'длинные видео о работе',  url:'https://youtube.com/@aleksvolkov', color:'#FF5A47' },
  { icon:'simple-icons:vk',        name:'VK',        handle:'vk.com/aleks',  note:'жизнь, идеи и репосты',   url:'https://vk.com/aleks',             color:'#4D8DFF' },
  { icon:'simple-icons:tiktok',    name:'TikTok',    handle:'@aleksvolkov',  note:'короткие видео',          url:'https://tiktok.com/@aleksvolkov',  color:'#2EE6E0' },
  { icon:'simple-icons:x',         name:'X / Twitter', handle:'@aleksvolkov', note:'мысли вслух и дискуссии',url:'https://x.com/aleksvolkov',        color:'#F4EFE2' },
  { icon:'simple-icons:github',    name:'GitHub',    handle:'@aleksvolkov',  note:'код и пет-проекты',       url:'https://github.com/aleksvolkov',   color:'#FFD84D' },
];
/* ============================================================ */

const DEFAULT_COLOR = '#D6FF3F';
const fine = matchMedia('(pointer:fine)').matches;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NAME_UPPER = PROFILE.name.toUpperCase();

// --- подстановка данных ---
document.title = PROFILE.name + ' — все ссылки';
 $('#brandName').textContent = NAME_UPPER + ' · СВЯЗЬ';
 $('#heroSub').textContent = PROFILE.role;
 $('#heroMeta').innerHTML =
  `<span>БАЗА — ${PROFILE.location}</span><span>ОТВЕЧАЮ В ТЕЧЕНИЕ 24 ЧАСОВ</span><span>ОБНОВЛЕНО — ${new Date().getFullYear()}</span>`;
 $('#emailText').textContent = PROFILE.email.toUpperCase();
 $('#mailtoLink').href = 'mailto:' + PROFILE.email;
 $('#footName').textContent = '© ' + new Date().getFullYear() + ' ' + NAME_UPPER;

// --- часы ---
const clock = $('#clock');
const tickClock = () => clock.textContent = new Date().toLocaleTimeString('ru-RU',{hour12:false});
tickClock(); setInterval(tickClock, 1000);

// --- имя на буквы ---
const h1 = $('#heroName');
h1.textContent = '';
const letters = [];
NAME_UPPER.split(' ').forEach((word, wi, arr) => {
  const w = document.createElement('span'); w.className = 'w';
  [...word].forEach(ch => {
    const s = document.createElement('span'); s.className = 'l'; s.textContent = ch;
    s.style.setProperty('--ld', (letters.length * 0.045) + 's');
    w.appendChild(s); letters.push(s);
  });
  h1.appendChild(w);
  if (wi < arr.length - 1) h1.appendChild(document.createTextNode(' '));
});
const showLetters = () => requestAnimationFrame(() => h1.classList.add('ready'));
(document.fonts && document.fonts.ready) ? document.fonts.ready.then(showLetters) : setTimeout(showLetters, 400);

// --- рендер строк-каналов ---
const ARROW = '<svg viewBox="0 0 24 24"><path d="M4 12h15M13 5l7 7-7 7"/></svg>';
const rowsBox = $('#rows');
LINKS.forEach((L, i) => {
  const a = document.createElement('a');
  a.className = 'row'; a.href = L.url; a.target = '_blank'; a.rel = 'noopener';
  a.dataset.icon = L.icon;
  a.style.setProperty('--c', L.color || DEFAULT_COLOR);
  a.style.setProperty('--d', (0.12 + i * 0.06) + 's');
  a.setAttribute('data-reveal','');
  a.innerHTML =
    `<span class="row-i">${String(i+1).padStart(2,'0')}</span>` +
    `<span class="row-icon"><iconify-icon icon="${L.icon}"></iconify-icon></span>` +
    `<span class="row-main"><span class="row-name">${L.name}</span><span class="row-note">${L.note}</span></span>` +
    `<span class="row-handle">${L.handle}</span>` +
    `<span class="row-arrow">${ARROW}</span>`;
  rowsBox.appendChild(a);
});
 $('#secCount').textContent = String(LINKS.length).padStart(2,'0');

// --- лента (две группы для бесшовности) ---
const star = '<svg viewBox="0 0 40 40" aria-hidden="true"><g stroke="currentColor" stroke-width="6" stroke-linecap="round"><line x1="20" y1="5" x2="20" y2="35"/><line x1="7.7" y1="12.5" x2="32.3" y2="27.5"/><line x1="7.7" y1="27.5" x2="32.3" y2="12.5"/></g></svg>';
const group = '<div class="tg">' + PROFILE.topics.map(t => `<span>${t}</span>${star}`).join('') + '</div>';
 $('#tickerTrack').innerHTML = group + group;

// --- появление секций ---
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
}), { threshold: 0.12 });
document.querySelectorAll('[data-reveal]').forEach(el => io.observe(el));

// --- тост ---
let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.querySelector('span').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

// --- копирование почты ---
 $('#emailBtn').addEventListener('click', async () => {
  const em = PROFILE.email;
  try { await navigator.clipboard.writeText(em); }
  catch(e) {
    const ta = document.createElement('textarea');
    ta.value = em; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  toast('Адрес скопирован — пишите!');
});

// --- наверх ---
 $('#toTop').addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));

// --- курсор, плавающая иконка, цветное дыхание имени ---
const dot = $('#cDot'), ring = $('#cRing');
const floatEl = $('#floatIcon'), floatGlyph = $('#floatGlyph');
let mx = innerWidth/2, my = innerHeight/2;
let rx = mx, ry = my, rs = 1, ringHot = false;
let fx = mx, fy = my, rot = 0, lastMx = mx, fS = 0.4, fShow = false;
let mouseIn = false;

addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; mouseIn = true; });
document.addEventListener('mouseleave', () => { mouseIn = false; });
document.addEventListener('mouseover', e => {
  ringHot = !!(e.target.closest('a,button,[data-hover]'));
  const row = e.target.closest('.row');
  if (row && fine && !reduced) {
    floatGlyph.setAttribute('icon', row.dataset.icon);
    floatEl.style.color = row.style.getPropertyValue('--c') || DEFAULT_COLOR;
    fShow = true;
  } else fShow = false;
});

// микс кремового и лайма для букв имени
const BASE = [244,239,226], ACID = [214,255,63];
const mixColor = t => {
  t = Math.min(1, t * 1.15);
  const r = Math.round(BASE[0] + (ACID[0]-BASE[0]) * t);
  const g = Math.round(BASE[1] + (ACID[1]-BASE[1]) * t);
  const b = Math.round(BASE[2] + (ACID[2]-BASE[2]) * t);
  return `rgb(${r},${g},${b})`;
};

function frame(t){
  if (fine){
    const vis = mouseIn ? 1 : 0;
    dot.style.opacity = vis; ring.style.opacity = vis; floatEl.style.opacity = fShow ? vis : 0;

    dot.style.transform = `translate3d(${mx}px,${my}px,0) translate(-50%,-50%)`;
    rx += (mx - rx) * 0.16; ry += (my - ry) * 0.16;
    rs += ((ringHot ? 1.7 : 1) - rs) * 0.14;
    ring.style.transform = `translate3d(${rx}px,${ry}px,0) translate(-50%,-50%) scale(${rs})`;

    fx += (mx - fx) * 0.11; fy += (my - fy) * 0.11;
    const vx = mx - lastMx; lastMx = mx;
    rot += (Math.max(-12, Math.min(12, vx * 0.35)) - rot) * 0.08;
    fS += ((fShow ? 1 : 0.4) - fS) * 0.12;
    floatEl.style.transform = `translate3d(${fx}px,${fy}px,0) translate(-50%,-50%) rotate(${rot}deg) scale(${fS})`;
  }

  if (!reduced){
    const centers = letters.map(el => {
      const r = el.getBoundingClientRect();
      return [r.left + r.width/2, r.top + r.height/2];
    });
    letters.forEach((el, i) => {
      let wgt = 430 + 80 * Math.sin(t * 0.0016 + i * 0.7);
      let near = 0;
      if (fine && mouseIn){
        const dx = mx - centers[i][0], dy = my - centers[i][1];
        near = Math.exp(-(dx*dx + dy*dy) / (2 * 160 * 160));
        wgt += 430 * near;
      }
      el.style.fontVariationSettings = `'wght' ${Math.round(Math.max(380, Math.min(900, wgt)))}`;
      el.style.color = mixColor(near);
    });
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
